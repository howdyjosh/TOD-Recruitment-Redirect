<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7b1020">
<title>ToD Delivery Partner Recruitment</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#fff}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
.splash{position:fixed;inset:0;z-index:2;display:grid;place-items:center;background:#7b1020;color:#fff;font-family:system-ui,sans-serif}
.box{text-align:center;padding:24px}.box h2{margin:12px 0 4px;font-size:22px}.box p{margin:0;opacity:.8;font-size:12px}
.spin{width:24px;height:24px;border:3px solid #ffffff4d;border-top-color:#fff;border-radius:50%;animation:r .8s linear infinite;margin:16px auto}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="splash" id="splash"><div class="box"><div style="font-size:42px">🛵</div><h2>Taste On Door</h2><p>Opening Delivery Partner Recruitment…</p><div class="spin"></div></div></div>
<iframe id="portal" title="Taste On Door Delivery Partner Recruitment" src="https://script.google.com/macros/s/AKfycbwAxlQieBdTFXngroL2UhCy-6sUtpcsACNbvUmRIHlqQAeBHNTuIk5uPjgc6154mvGVDg/exec?page=recruitment"></iframe>
<script>document.getElementById('portal').addEventListener('load',function(){document.getElementById('splash').style.display='none';});</script>
</body>
</html>
